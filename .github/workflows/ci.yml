name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The required lane installs the C and C++ compilers explicitly and fails if
  # the registry guard finds them absent: a skipped runtime test is not a pass.
  required:
    name: required (python ${{ matrix.python }}, ${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install native toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc g++ clang
          echo "CC=${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}" >> "$GITHUB_ENV"

      - name: Show tool versions
        run: |
          python3 --version
          "$CC" --version | head -1
          "$CXX" --version | head -1

      # Hosted runners deny unprivileged user namespaces (AppArmor on Ubuntu
      # 23.10+), which silently turned the isolation gate into a test of the
      # refusal path. Restore the backend when the runner allows it, and report
      # which backend actually ran either way: a lane must not be green while
      # testing something other than what its name says.
      - name: Enable unprivileged user namespaces (best effort)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Isolation backend
        id: isolation
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, ".")
          from nava_lang import sandbox
          host = sandbox.describe_host()
          print("host:", json.dumps(host, indent=2))
          available = host["namespaces_available"]
          if available:
              print("::notice::isolation backend: namespaces")
          else:
              print(f"::warning::isolation backend: rlimits ({host['namespaces_reason']}); "
                    "the gate below asserts the documented refusal instead of the jail")
          with open(os.environ["GITHUB_OUTPUT"], "w", encoding="utf-8") as handle:
              handle.write(f"namespaces={'true' if available else 'false'}\n")
          PY

      - name: Registry and fixture guard
        run: python3 tests/registry.py

      - name: Release metadata, Python floor and credential scan
        run: python3 tools/verify_release.py

      - name: Release gate tests
        run: python3 -m unittest tests.test_release -v

      - name: Executable specification (grammar, fixtures, limits, fuzzing)
        run: python3 -m unittest tests.test_spec -v

      - name: Test suite (no skipped tests allowed)
        run: python3 -m unittest discover -s tests -v

      - name: Isolation gate
        run: |
          if [ "${{ steps.isolation.outputs.namespaces }}" = "true" ]; then
            # The jail really is exercisable here, so demand it rather than
            # quietly accepting the fallback.
            python3 tests/registry.py --require-namespaces
            python3 -m unittest -v tests.test_sandbox tests.test_files
          else
            python3 -m unittest -v tests.test_sandbox tests.test_files
            echo "::warning::no namespace backend on this runner: the jail test asserted the refusal path"
            set +e
            python3 nava run eval/solutions/gcd.nv --isolation required
            status=$?
            python3 tests/registry.py --require-namespaces > /dev/null 2>&1
            strict=$?
            set -e
            if [ "$status" -ne 2 ]; then
              echo "::error::'--isolation required' did not refuse on a host without namespaces (status $status)"
              exit 1
            fi
            if [ "$strict" -ne 1 ]; then
              echo "::error::'registry.py --require-namespaces' passed without a namespace backend"
              exit 1
            fi
            echo "the CLI refused required isolation with status 2 and E0601, and the strict registry guard failed, as documented"
          fi

      - name: Diagnostic contract smoke test
        run: |
          printf 'fn main() { let x: bool = 1 }\n' > "$RUNNER_TEMP/bad.nv"
          python3 nava --format json check "$RUNNER_TEMP/bad.nv" > "$RUNNER_TEMP/report.json" || true
          python3 - "$RUNNER_TEMP/report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          assert report["status"] == "error"
          first = report["diagnostics"][0]
          assert first["code"] == "E0311", first
          assert first["range"]["start"]["line"] == 1
          assert first["severity"] == "error" and first["hint"]
          print("diagnostic contract holds:", first["code"], first["title"])
          PY

      - name: Cross-language GCD verification
        run: python3 experiment/verify.py

      - name: Evaluation fixtures agree with the independent reference
        run: python3 eval/reference.py --check

  # A separate lane documents the fail-closed behaviour: with no C compiler the
  # guard must fail rather than quietly skipping the runtime tests.
  guard-fails-without-compilers:
    name: guard fails without compilers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Registry guard must reject a host without cc and c++
        run: |
          mkdir -p "$RUNNER_TEMP/empty-bin"
          if PATH="$RUNNER_TEMP/empty-bin" python3 tests/registry.py; then
            echo "::error::the registry guard passed without a C compiler"
            exit 1
          fi
          echo "guard correctly failed without compilers"

  # Release lane: build the artifacts, prove they are complete and clean,
  # install the wheel into a fresh environment, and use it from a directory
  # that is not the checkout. That last part is what catches a missing
  # `package-data` entry: a stdlib that only resolves in the source tree.
  release:
    name: release artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc
      - run: python3 -m pip install --upgrade pip build

      - name: Build the wheel and the sdist
        run: python3 -m build

      - name: Artifacts are complete, clean and licensed
        run: python3 tools/verify_release.py --artifacts dist --json "$RUNNER_TEMP/release.json"

      - name: An incomplete wheel must be rejected
        run: |
          mkdir -p "$RUNNER_TEMP/broken"
          cp dist/*.whl dist/*.tar.gz "$RUNNER_TEMP/broken/"
          python3 - "$RUNNER_TEMP/broken" <<'PY'
          import pathlib, sys, zipfile
          directory = pathlib.Path(sys.argv[1])
          wheel = next(directory.glob("*.whl"))
          rebuilt = wheel.with_suffix(".broken")
          with zipfile.ZipFile(wheel) as source, zipfile.ZipFile(rebuilt, "w") as target:
              for name in source.namelist():
                  if "/stdlib/" in name:
                      continue          # the standard library silently missing
                  target.writestr(name, source.read(name))
          rebuilt.replace(wheel)
          PY
          if python3 tools/verify_release.py --quiet --artifacts "$RUNNER_TEMP/broken"; then
            echo "::error::a wheel without the standard library was accepted"
            exit 1
          fi
          echo "the artifact gate rejected a wheel without nava_lang/stdlib"

      - name: Install the wheel outside the checkout and use it
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          mkdir -p "$RUNNER_TEMP/work"
          printf 'import math\nfn main() {\n    print(math::abs(-7))\n    print(math::gcd(48, 18))\n}\n' \
            > "$RUNNER_TEMP/work/demo.nv"
          cd "$RUNNER_TEMP/work"
          "$RUNNER_TEMP/venv/bin/nava" --version
          "$RUNNER_TEMP/venv/bin/nava" check demo.nv
          "$RUNNER_TEMP/venv/bin/nava" build demo.nv -o demo
          test "$(./demo)" = "$(printf '7\n6')"
          "$RUNNER_TEMP/venv/bin/nava" run demo.nv
          echo "the installed package compiles and runs a program that imports the stdlib"

  # Study lane: the paired-study harness must run end to end without a model,
  # and must refuse to present a model-less run as a measurement.
  study-harness:
    name: study harness (no model)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc g++
      - name: Predeclared plan
        run: python3 eval/study.py --plan-only --provider openai --model ci --attempts 30
      - name: Mock study end to end
        run: |
          python3 eval/study.py --provider mock --task gcd --task sum_to_n \
            --languages nava,c,cpp --attempts 2 --isolation auto \
            --out "$RUNNER_TEMP/study.json"
          python3 eval/check_study_record.py "$RUNNER_TEMP/study.json" --require not-measured
          python3 - "$RUNNER_TEMP/study.json" <<'PY'
          import json, sys
          record = json.load(open(sys.argv[1], encoding="utf-8"))
          # Without this the lane was green while every attempt failed to run:
          # the record said "not-measured" and nobody asked why.
          backend = record["plan"]["isolation_backend"]
          assert backend in ("namespaces", "rlimits"), backend
          evaluated = record["model_measurements"]["evaluated_attempts"]
          assert evaluated == 12, f"only {evaluated} of 12 attempts were compiled and tested"
          point = record["aggregates"]["gcd/nava"]["pass_at_1"]["point"]
          assert point == 1.0, f"the known-correct answer did not pass: pass@1 {point}"
          print(f"compiled and tested {evaluated} attempts under {backend}")
          PY
      - name: A provider error must not look like a measurement
        run: |
          set +e
          python3 eval/study.py --provider openai --base-url http://127.0.0.1:9/v1 \
            --model ci --api-key-env CI_MISSING_KEY --task gcd --languages nava --attempts 1 \
            --out "$RUNNER_TEMP/failed.json" --quiet
          status=$?
          set -e
          test "$status" -eq 1
          python3 eval/check_study_record.py "$RUNNER_TEMP/failed.json" --require not-measured

  # N7 lane: the model-facing guide, the grammar, the constrained adapter and
  # the A/B harness must work end to end without a model, and must refuse to
  # look like a measurement when no model was called.
  constrained-harness:
    name: constrained generation harness (no model)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc g++

      - name: Guide digests and canonical examples
        run: |
          python3 eval/guide.py --verify
          python3 eval/guide.py --examples

      - name: No tokenizer, no token count
        run: |
          python3 eval/tokens.py --probe > "$RUNNER_TEMP/probe.json"
          python3 - "$RUNNER_TEMP/probe.json" <<'PY'
          import json, sys
          probe = json.load(open(sys.argv[1]))["probe"]
          print("tokenizers:", probe)
          assert probe["tiktoken"] is None, "this lane assumes no tokenizer is installed"
          PY
          set +e
          python3 eval/tokens.py --guide --require measured > /dev/null 2>&1
          measured=$?
          python3 eval/overhead.py --require measured > /dev/null 2>&1
          overhead=$?
          set -e
          test "$measured" -eq 1
          test "$overhead" -eq 1
          echo "both tools refused to report a token count without a tokenizer"

      - name: Grammar artefact, executed
        run: |
          python3 eval/grammar.py --emit "$RUNNER_TEMP/nava.gbnf"
          python3 eval/grammar.py --validate
          python3 eval/grammar.py --check guides/examples/hello.nv
          python3 eval/grammar.py --chars --check guides/examples/control.nv
          set +e
          printf 'fn main( {\n' > "$RUNNER_TEMP/broken.nv"
          python3 eval/grammar.py --check "$RUNNER_TEMP/broken.nv"
          status=$?
          set -e
          test "$status" -eq 1

      - name: Constrained adapter declares itself unverified
        run: |
          python3 eval/constrained.py --interface llamacpp --check --summary > /dev/null
          python3 eval/constrained.py --interface vllm --check --summary > /dev/null

      - name: A/B harness without a model
        run: |
          python3 eval/ab.py --plan-only --provider openai --model ci --attempts 30 > /dev/null
          python3 eval/ab.py --provider mock --task gcd --attempts 1 --isolation auto \
            --out "$RUNNER_TEMP/ab.json"
          python3 eval/check_ab_record.py "$RUNNER_TEMP/ab.json" --require not-measured
          python3 - "$RUNNER_TEMP/ab.json" <<'PY'
          import json, sys
          record = json.load(open(sys.argv[1], encoding="utf-8"))
          for arm in ("free", "constrained"):
              evaluated = record["arms"][arm]["evaluated_attempts"]
              assert evaluated == 1, f"{arm}: {evaluated} of 1 attempt was compiled and tested"
          print("both arms compiled and tested their attempt under",
                record["plan"]["isolation_backend"])
          PY
          set +e
          python3 eval/check_ab_record.py "$RUNNER_TEMP/ab.json" --require measured
          status=$?
          set -e
          test "$status" -eq 1
          echo "the A/B record cannot be presented as a measurement"

      - name: Structured feedback keeps the stages apart
        run: |
          printf 'fn main( {\n' > "$RUNNER_TEMP/broken.nv"
          python3 eval/feedback.py "$RUNNER_TEMP/broken.nv" | tee "$RUNNER_TEMP/feedback.txt"
          grep -q "parse" "$RUNNER_TEMP/feedback.txt"
          if grep -q "tests" "$RUNNER_TEMP/feedback.txt"; then
            echo "::error::a syntactically invalid candidate was reported as a test failure"
            exit 1
          fi

  # Benchmark record lane: the script must produce a valid machine-readable
  # record. It is not a performance gate and results are not compared here.
  benchmark:
    name: benchmark record
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc g++
      - name: Produce a record
        run: python3 bench/run.py --iterations 100000 --samples 3 --json "$RUNNER_TEMP/bench.json"
      - name: Validate the record
        run: |
          python3 - <<'PY'
          import json, pathlib, os
          record = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "bench.json").read_text())
          assert record["schema"] == "nava-bench/1"
          assert record["failures"] == []
          assert record["reference_check"]["ok"] is True
          assert record["model_measurements"]["status"] == "not-measured"
          assert all(program["runs_ms"] for program in record["programs"])
          print("benchmark record is valid")
          PY
